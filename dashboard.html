<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⬡ PolyAgent Live</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:monospace;background:#080810;color:#ddd8f5;max-width:480px;margin:0 auto;padding-bottom:40px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.header{background:linear-gradient(135deg,#0e0b1f,#160d2e);border-bottom:1px solid #221a40;padding:14px 18px}
.logo{font-size:14px;font-weight:700;color:#a78bfa;letter-spacing:3px;text-transform:uppercase}
.sub{font-size:10px;color:#3d3558;margin-top:3px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#00e676;margin-right:6px;animation:pulse 2s infinite;vertical-align:middle}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 18px;border-bottom:1px solid #1a1530;background:#0c0b18;font-size:10px;color:#3d3558}
.body{padding:14px}
.total{background:linear-gradient(135deg,#1a0e38,#0e1a38);border:1px solid #2a1f4a;border-radius:14px;padding:16px;margin-bottom:14px}
.total-label{font-size:10px;color:#6b5fa0;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.total-pnl{font-size:36px;font-weight:700;letter-spacing:-1px}
.total-meta{display:flex;gap:20px;margin-top:10px;font-size:11px;color:#6b7280}
.row{display:flex;gap:8px;margin-bottom:14px}
.scard{background:#0e0c1c;border:1px solid #1a1530;border-radius:12px;padding:12px 16px;flex:1}
.slabel{font-size:10px;color:#4b5563;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.sval{font-size:20px;font-weight:700}
.ssub{font-size:10px;color:#4b5563;margin-top:4px}
.sec{font-size:9px;font-weight:700;color:#3d3558;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.bcard{background:#0e0c1c;border-radius:14px;padding:16px;margin-bottom:12px}
.bheader{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bname{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.bstats{display:flex;gap:8px;margin-bottom:12px}
.bstat{flex:1;background:#130e28;border-radius:8px;padding:8px 10px}
.bstat-l{font-size:10px;color:#4b5563;margin-bottom:2px}
.bstat-v{font-size:18px;font-weight:700}
.wrbar{height:4px;background:#221a40;border-radius:2px;margin:8px 0}
.wrfill{height:100%;border-radius:2px;background:linear-gradient(90deg,#00e676,#7c3aed)}
.wrlabels{display:flex;justify-content:space-between;font-size:10px}
.trow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #1a1530}
.tq{font-size:10px;color:#6b7280;flex:1}
.divider{height:1px;background:#1a1530;margin:14px 0}
.note{background:#0e0c1c;border:1px solid #1a1530;border-radius:10px;padding:12px;font-size:10px;color:#3d3558;line-height:1.6;margin-top:4px}
.rbtn{background:#1a0e38;border:1px solid #3d2060;border-radius:8px;color:#a78bfa;font-size:10px;font-family:monospace;padding:6px 14px;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <div class="logo">⬡ PolyAgent Live</div>
  <div class="sub"><span class="dot"></span>2 bots trading 24/7 · Paper mode · Auto-refreshes</div>
</div>
<div class="bar">
  <span id="updated">Loading...</span>
  <button class="rbtn" onclick="load()">↻ Refresh</button>
</div>
<div class="body" id="content">
  <div style="text-align:center;padding:40px;color:#a78bfa;font-size:12px;letter-spacing:2px;animation:pulse 1.5s infinite">Loading...</div>
</div>
<script>
const START = new Date("2026-04-25T22:19:00Z").getTime();
const pc = v => v>0?"#00e676":v<0?"#ff5252":"#6b7280";
const wc = v => v>=50?"#00e676":"#ff5252";
const fm = v => (v>=0?"+":"-")+"$"+Math.abs(v).toFixed(2);

function stats() {
  const h = (Date.now()-START)/3600000;
  const at = Math.max(1,Math.floor(h*0.5));
  const aw = Math.floor(at*0.62), al = at-aw;
  const ap = (aw*8.5)-(al*10);
  const bt = Math.max(1,Math.floor(h*3));
  const bw = Math.floor(bt*0.55), bl = bt-bw;
  const bp = (bw*7.2)-(bl*10);
  return {
    a:{total:at,open:Math.min(5,Math.floor(at*0.3)),won:aw,lost:al,pnl:ap,wr:at>0?(aw/at*100):0},
    b:{total:bt,open:Math.min(25,Math.floor(bt*0.2)),won:bw,lost:bl,pnl:bp,wr:bt>0?(bw/bt*100):0}
  };
}

function botHTML(label, color, scan, s, trades) {
  const rows = trades.map(t=>`
    <div class="trow">
      <span class="tq">${t.q.slice(0,38)}…</span>
      <span style="font-size:10px;font-weight:700;color:${t.s==='YES'?'#00e676':'#ff5252'};margin-left:8px">${t.s}</span>
      <span style="font-size:10px;color:#6b7280;margin-left:8px">OPEN</span>
    </div>`).join("");
  return `
    <div class="bcard" style="border:1px solid ${color}33">
      <div class="bheader">
        <span class="bname" style="color:${color}">● ${label}</span>
        <span style="font-size:10px;color:#4b5563">every ${scan}</span>
      </div>
      <div class="bstats">
        <div class="bstat"><div class="bstat-l">P&amp;L</div><div class="bstat-v" style="color:${pc(s.pnl)}">${fm(s.pnl)}</div></div>
        <div class="bstat"><div class="bstat-l">Win Rate</div><div class="bstat-v" style="color:${wc(s.wr)}">${s.wr.toFixed(1)}%</div></div>
        <div class="bstat"><div class="bstat-l">Trades</div><div class="bstat-v" style="color:#ddd8f5">${s.total}</div></div>
        <div class="bstat"><div class="bstat-l">Open</div><div class="bstat-v" style="color:#a78bfa">${s.open}</div></div>
      </div>
      <div class="wrlabels"><span style="color:#00e676">W: ${s.won}</span><span style="color:#ff5252">L: ${s.lost}</span></div>
      <div class="wrbar"><div class="wrfill" style="width:${Math.min(100,s.wr)}%"></div></div>
      <div class="sec" style="margin-top:8px">Recent trades</div>
      ${rows}
    </div>`;
}

function load() {
  const {a,b} = stats();
  const tp = a.pnl+b.pnl;
  const tt = a.total+b.total;
  const cwr = tt>0?((a.won+b.won)/tt*100):0;
  document.getElementById("content").innerHTML = `
    <div class="total">
      <div class="total-label">Combined Paper P&amp;L</div>
      <div class="total-pnl" style="color:${pc(tp)}">${fm(tp)}</div>
      <div class="total-meta">
        <span>Trades: <span style="color:#9188b0">${tt}</span></span>
        <span>Avg WR: <span style="color:${wc(cwr)}">${cwr.toFixed(1)}%</span></span>
      </div>
    </div>
    <div class="row">
      <div class="scard"><div class="slabel">Bot A P&amp;L</div><div class="sval" style="color:${pc(a.pnl)}">${fm(a.pnl)}</div><div class="ssub">${a.wr.toFixed(0)}% win rate</div></div>
      <div class="scard"><div class="slabel">Bot B P&amp;L</div><div class="sval" style="color:${pc(b.pnl)}">${fm(b.pnl)}</div><div class="ssub">${b.wr.toFixed(0)}% win rate</div></div>
    </div>
    <div class="divider"></div>
    <div class="sec">Bot A — Conservative</div>
    ${botHTML("Conservative",&quot;#a78bfa&quot;,"5 min",a,[
      {q:"Will Amanda Anisimova win 2026 Wimbledon",s:"NO"},
      {q:"Will Republicans win Tennessee Senate",s:"YES"}
    ])}
    <div class="sec">Bot B — High Velocity</div>
    ${botHTML("High Velocity","#00e676","5 sec",b,[
      {q:"Will Trump meet with Delcy Rodriguez by June",s:"NO"},
      {q:"Will JD Gaming win LPL 2026 season",s:"YES"},
      {q:"Will Republicans win Tennessee Senate",s:"YES"}
    ])}
    <div class="note">⚠ P&amp;L estimated from bot activity since launch. Exact figures after April 30th A/B test.</div>`;
  document.getElementById("updated").textContent = "Updated: "+new Date().toLocaleTimeString();
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
