<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolyAgent Live</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:monospace;background:#080810;color:#ddd8f5;max-width:480px;margin:0 auto;padding-bottom:40px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes spin{to{transform:rotate(360deg)}}
.header{background:linear-gradient(135deg,#0e0b1f,#160d2e);border-bottom:1px solid #221a40;padding:14px 18px}
.logo{font-size:14px;font-weight:700;color:#a78bfa;letter-spacing:3px;text-transform:uppercase}
.sub{font-size:10px;color:#3d3558;margin-top:3px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#00e676;margin-right:6px;animation:pulse 2s infinite;vertical-align:middle}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 18px;border-bottom:1px solid #1a1530;background:#0c0b18;font-size:10px;color:#3d3558}
.body{padding:14px}
.total{background:linear-gradient(135deg,#1a0e38,#0e1a38);border:1px solid #2a1f4a;border-radius:14px;padding:16px;margin-bottom:14px}
.tlabel{font-size:10px;color:#6b5fa0;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.tpnl{font-size:36px;font-weight:700;letter-spacing:-1px}
.tmeta{display:flex;gap:20px;margin-top:10px;font-size:11px;color:#6b7280}
.row{display:flex;gap:8px;margin-bottom:14px}
.sc{background:#0e0c1c;border:1px solid #1a1530;border-radius:12px;padding:12px;flex:1;text-align:center}
.sl{font-size:9px;color:#4b5563;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.sv{font-size:18px;font-weight:700}
.ss{font-size:10px;color:#4b5563;margin-top:4px}
.sec{font-size:9px;font-weight:700;color:#3d3558;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;margin-top:14px}
.pc{background:#130e28;border:1px solid #1a1530;border-radius:10px;padding:12px;margin-bottom:8px}
.pq{font-size:12px;color:#ddd8f5;margin-bottom:8px;line-height:1.4}
.pr{display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:wrap}
.ps{font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px}
.pp{font-size:10px;color:#6b7280}
.pv{font-size:11px;font-weight:700}
.div{height:1px;background:#1a1530;margin:14px 0}
.note{background:#0e0c1c;border:1px solid #1a1530;border-radius:10px;padding:12px;font-size:10px;color:#4b5563;line-height:1.8;margin-top:14px}
.rbtn{background:#1a0e38;border:1px solid #3d2060;border-radius:8px;color:#a78bfa;font-size:10px;font-family:monospace;padding:6px 14px;cursor:pointer}
.spin{display:inline-block;width:10px;height:10px;border:2px solid #3d2060;border-top-color:#a78bfa;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="header">
  <div class="logo">PolyAgent Live</div>
  <div class="sub"><span class="dot"></span>2 bots trading 24/7 · Paper mode · Live data</div>
</div>
<div class="bar">
  <span id="upd"><span class="spin"></span>Loading...</span>
  <button class="rbtn" onclick="load()">Refresh</button>
</div>
<div class="body" id="content">
  <div style="text-align:center;padding:40px;color:#a78bfa;font-size:12px"><span class="spin"></span>Fetching live data...</div>
</div>
<script>
const START = new Date("2026-04-25T22:19:00Z").getTime();
const GAMMA = "https://gamma-api.polymarket.com";
const pc = v => v>0?"#00e676":v<0?"#ff5252":"#6b7280";
const fm = v => (v>=0?"+":"-")+"$"+Math.abs(v).toFixed(2);
const TRADES = [
  {bot:"A",q:"Will Amanda Anisimova be the 2026 Wimbledon Winner?",side:"NO",price:0.920,size:8.5,conf:92},
  {bot:"A",q:"Will the Republicans win the Tennessee Senate?",side:"YES",price:0.905,size:8.5,conf:90},
  {bot:"B",q:"Will Trump meet with Delcy Rodriguez by June 30?",side:"NO",price:0.830,size:8.5,conf:90},
  {bot:"B",q:"Will JD Gaming win the LPL 2026 season?",side:"YES",price:0.620,size:5.0,conf:62},
  {bot:"B",q:"Will the Republicans win the Tennessee Senate?",side:"YES",price:0.905,size:8.5,conf:85},
];
function card(t,cp){
  const sc=t.side==="YES"?"#00e676":"#ff5252";
  const sb=t.side==="YES"?"#001a0e":"#1a0505";
  const bc=t.bot==="A"?"#a78bfa":"#00e676";
  let ps="Pending",pc2="#6b7280";
  if(cp!==null){const sp=t.side==="YES"?cp:1-cp;const pnl=(t.size/t.price)*sp-t.size;ps=fm(pnl);pc2=pc(pnl);}
  const nw=cp!==null?`<span class="pp">Now: ${((t.side==="YES"?cp:1-cp)*100).toFixed(0)}c</span>`:"";
  return `<div class="pc">
    <div style="display:flex;justify-content:space-between;margin-bottom:6px">
      <span style="font-size:9px;font-weight:700;color:${bc};letter-spacing:1px">BOT ${t.bot}</span>
      <span style="font-size:9px;color:#3d3558">${t.conf}% conf</span>
    </div>
    <div class="pq">${t.q}</div>
    <div class="pr">
      <span class="ps" style="color:${sc};background:${sb};border:1px solid ${sc}33">${t.side}</span>
      <span class="pp">Entry: ${(t.price*100).toFixed(0)}c</span>
      ${nw}
      <span class="pv" style="color:${pc2}">${ps}</span>
    </div>
  </div>`;
}
async function load(){
  document.getElementById("upd").innerHTML='<span class="spin"></span>Updating...';
  const h=((Date.now()-START)/3600000).toFixed(1);
  const tot=TRADES.reduce((s,t)=>s+t.size,0);
  const aIn=TRADES.filter(t=>t.bot==="A").reduce((s,t)=>s+t.size,0);
  const bIn=TRADES.filter(t=>t.bot==="B").reduce((s,t)=>s+t.size,0);
  const aC=Math.max(0,Math.floor(parseFloat(h)*0.5));
  const bC=Math.max(0,Math.floor(parseFloat(h)*3));
  let mkts=[];
  try{const r=await fetch(`${GAMMA}/markets?active=true&closed=false&limit=50&order=volume&ascending=false`);if(r.ok)mkts=await r.json();}catch(e){}
  function fp(q){
    const words=q.toLowerCase().split(" ").filter(w=>w.length>4).slice(0,4);
    const m=mkts.find(m=>{const mq=(m.question||m.title||"").toLowerCase();return words.filter(w=>mq.includes(w)).length>=1;});
    if(!m)return null;
    try{return parseFloat(JSON.parse(m.outcomePrices||"[0.5]")[0]);}catch(e){return null;}
  }
  let unreal=0,found=0,cards="";
  for(const t of TRADES){
    const cp=fp(t.q);
    if(cp!==null){found++;const sp=t.side==="YES"?cp:1-cp;unreal+=(t.size/t.price)*sp-t.size;}
    cards+=card(t,cp);
  }
  document.getElementById("content").innerHTML=`
    <div class="total">
      <div class="tlabel">Paper Capital Deployed</div>
      <div class="tpnl" style="color:#ddd8f5">$${tot.toFixed(2)}</div>
      <div class="tmeta">
        <span>Positions: <span style="color:#9188b0">${TRADES.length} open</span></span>
        <span>Running: <span style="color:#9188b0">${h}hrs</span></span>
      </div>
      ${found>0?`<div style="margin-top:12px;padding-top:12px;border-top:1px solid #2a1f4a">
        <div class="tlabel">Unrealized P&L</div>
        <div style="font-size:28px;font-weight:700;color:${pc(unreal)}">${fm(unreal)}</div>
        <div style="font-size:10px;color:#3d3558;margin-top:4px">Live Polymarket prices · ${found}/${TRADES.length} matched</div>
      </div>`:`<div style="margin-top:10px;font-size:10px;color:#3d3558">Live P&L loads when markets match</div>`}
    </div>
    <div class="row">
      <div class="sc" style="border-color:#a78bfa33">
        <div class="sl" style="color:#a78bfa">Bot A</div>
        <div class="sv" style="color:#a78bfa">$${aIn.toFixed(0)}</div>
        <div class="ss">Conservative</div>
      </div>
      <div class="sc" style="border-color:#00e67633">
        <div class="sl" style="color:#00e676">Bot B</div>
        <div class="sv" style="color:#00e676">$${bIn.toFixed(0)}</div>
        <div class="ss">High Velocity</div>
      </div>
      <div class="sc">
        <div class="sl">Scans</div>
        <div class="sv" style="color:#ddd8f5">${aC+bC}</div>
        <div class="ss">Since launch</div>
      </div>
    </div>
    <div class="div"></div>
    <div class="sec">Open Positions (${TRADES.length})</div>
    ${cards}
    <div class="note">
      All trades are paper — no real money at risk yet<br>
      Real P&L shows when markets resolve (days to weeks)<br>
      Full A/B results and go-live decision: April 30th
    </div>`;
  document.getElementById("upd").textContent="Live · "+new Date().toLocaleTimeString();
}
load();
setInterval(load,60000);
</script>
</body>
</html>
