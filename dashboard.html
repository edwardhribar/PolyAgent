<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolyAgent Live</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:monospace;background:#080810;color:#ddd8f5;max-width:480px;margin:0 auto;padding-bottom:40px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes spin{to{transform:rotate(360deg)}}
.header{background:linear-gradient(135deg,#0e0b1f,#160d2e);border-bottom:1px solid #221a40;padding:14px 18px}
.logo{font-size:14px;font-weight:700;color:#a78bfa;letter-spacing:3px;text-transform:uppercase}
.sub{font-size:10px;color:#3d3558;margin-top:3px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#00e676;margin-right:6px;animation:pulse 2s infinite;vertical-align:middle}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 18px;border-bottom:1px solid #1a1530;background:#0c0b18;font-size:10px;color:#3d3558}
.body{padding:14px}
.total{background:linear-gradient(135deg,#1a0e38,#0e1a38);border:1px solid #2a1f4a;border-radius:14px;padding:16px;margin-bottom:14px}
.tlabel{font-size:10px;color:#6b5fa0;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.tpnl{font-size:36px;font-weight:700;letter-spacing:-1px}
.tmeta{display:flex;gap:16px;margin-top:10px;font-size:11px;color:#6b7280;flex-wrap:wrap}
.row{display:flex;gap:8px;margin-bottom:14px}
.sc{background:#0e0c1c;border:1px solid #1a1530;border-radius:12px;padding:12px;flex:1;text-align:center}
.sl{font-size:9px;color:#4b5563;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.sv{font-size:18px;font-weight:700}
.ss{font-size:10px;color:#4b5563;margin-top:4px}
.sec{font-size:9px;font-weight:700;color:#3d3558;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;margin-top:14px}
.bcard{border-radius:14px;padding:16px;margin-bottom:12px}
.bhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bstats{display:flex;gap:8px;margin-bottom:10px}
.bstat{flex:1;background:#130e28;border-radius:8px;padding:8px 10px;text-align:center}
.bstat-l{font-size:9px;color:#4b5563;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.bstat-v{font-size:16px;font-weight:700}
.wrbar{height:4px;background:#221a40;border-radius:2px;margin:6px 0}
.wrfill{height:100%;border-radius:2px;background:linear-gradient(90deg,#00e676,#7c3aed)}
.wrl{display:flex;justify-content:space-between;font-size:10px;margin-bottom:4px}
.tc{background:#130e28;border:1px solid #1a1530;border-radius:8px;padding:10px;margin-bottom:6px}
.tq{font-size:11px;color:#ddd8f5;margin-bottom:6px;line-height:1.4}
.tr{display:flex;justify-content:space-between;align-items:center;gap:4px}
.ts{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.tp{font-size:10px;color:#6b7280}
.tv{font-size:10px;font-weight:700}
.div{height:1px;background:#1a1530;margin:14px 0}
.note{background:#0e0c1c;border:1px solid #1a1530;border-radius:10px;padding:12px;font-size:10px;color:#4b5563;line-height:1.8;margin-top:14px}
.rbtn{background:#1a0e38;border:1px solid #3d2060;border-radius:8px;color:#a78bfa;font-size:10px;font-family:monospace;padding:6px 14px;cursor:pointer}
.spin{display:inline-block;width:10px;height:10px;border:2px solid #3d2060;border-top-color:#a78bfa;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:6px;vertical-align:middle}
.err{font-size:10px;color:#ff5252;margin-top:6px}
</style>
</head>
<body>
<div class="header">
  <div class="logo">PolyAgent Live</div>
  <div class="sub"><span class="dot"></span>2 bots trading 24/7 · Real data · Auto-refreshes</div>
</div>
<div class="bar">
  <span id="upd"><span class="spin"></span>Loading...</span>
  <button class="rbtn" onclick="load()">↻ Refresh</button>
</div>
<div class="body" id="content">
  <div style="text-align:center;padding:40px;color:#a78bfa;font-size:12px"><span class="spin"></span>Connecting to bots...</div>
</div>

<script>
// !! REPLACE THESE WITH YOUR ACTUAL RAILWAY URLS !!
const BOT_A_URL = "https://conservative-bot-url.up.railway.app";
const BOT_B_URL = "https://hv-bot-url.up.railway.app";

const pc = v => v>0?"#00e676":v<0?"#ff5252":"#6b7280";
const fm = v => (v>=0?"+":"-")+"$"+Math.abs(v).toFixed(2);
const wc = v => v>=50?"#00e676":"#ff5252";

async function fetchBot(url, name) {
  try {
    const r = await fetch(`${url}/api/stats`, {signal: AbortSignal.timeout(5000)});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch(e) {
    return {error: true, bot: name, total_trades:0, open_positions:0, won:0, lost:0, win_rate:0, total_pnl:0, invested:0, recent_trades:[]};
  }
}

function botCard(d, color, scan) {
  const wr = d.win_rate || 0;
  const pnl = d.total_pnl || 0;
  const trades = (d.recent_trades || []).slice(0, 3);
  const tradeRows = trades.map(t => {
    const sc = t.side==="YES"?"#00e676":"#ff5252";
    const sb = t.side==="YES"?"#001a0e":"#1a0505";
    const st = t.status==="open" ? "<span style='color:#6b7280'>OPEN</span>"
             : t.status==="won"  ? `<span style='color:#00e676'>${fm(t.pnl)}</span>`
             : `<span style='color:#ff5252'>${fm(t.pnl)}</span>`;
    return `<div class="tc">
      <div class="tq">${(t.question||"").slice(0,55)}${t.question&&t.question.length>55?"…":""}</div>
      <div class="tr">
        <span class="ts" style="color:${sc};background:${sb};border:1px solid ${sc}33">${t.side}</span>
        <span class="tp">${(t.price*100||0).toFixed(0)}c · $${t.size||0}</span>
        <span class="tp">${t.confidence||0}% conf</span>
        ${st}
      </div>
    </div>`;
  }).join("");

  return `<div class="bcard" style="background:#0e0c1c;border:1px solid ${color}33">
    <div class="bhead">
      <span style="font-size:11px;font-weight:700;color:${color};letter-spacing:2px">● ${d.bot||"Bot"} ${d.error?"<span class='err'>offline</span>":""}</span>
      <span style="font-size:10px;color:#4b5563">${scan} · ${d.paper_mode!==false?"PAPER":"LIVE"}</span>
    </div>
    <div class="bstats">
      <div class="bstat"><div class="bstat-l">P&L</div><div class="bstat-v" style="color:${pc(pnl)}">${fm(pnl)}</div></div>
      <div class="bstat"><div class="bstat-l">Win Rate</div><div class="bstat-v" style="color:${wc(wr)}">${wr.toFixed(1)}%</div></div>
      <div class="bstat"><div class="bstat-l">Trades</div><div class="bstat-v" style="color:#ddd8f5">${d.total_trades||0}</div></div>
      <div class="bstat"><div class="bstat-l">Open</div><div class="bstat-v" style="color:#a78bfa">${d.open_positions||0}</div></div>
    </div>
    <div class="wrl"><span style="color:#00e676">W: ${d.won||0}</span><span style="color:#ff5252">L: ${d.lost||0}</span></div>
    <div class="wrbar"><div class="wrfill" style="width:${Math.min(100,wr)}%"></div></div>
    ${trades.length>0?`<div class="sec" style="margin-top:10px">Recent trades</div>${tradeRows}`:"<div style='font-size:10px;color:#3d3558;margin-top:8px;text-align:center'>No trades yet</div>"}
  </div>`;
}

async function load() {
  document.getElementById("upd").innerHTML='<span class="spin"></span>Updating...';
  const [a, b] = await Promise.all([
    fetchBot(BOT_A_URL, "Conservative"),
    fetchBot(BOT_B_URL, "HV"),
  ]);

  const totalPnl = (a.total_pnl||0) + (b.total_pnl||0);
  const totalTrades = (a.total_trades||0) + (b.total_trades||0);
  const totalOpen = (a.open_positions||0) + (b.open_positions||0);
  const totalInvested = (a.invested||0) + (b.invested||0);
  const combinedWon = (a.won||0) + (b.won||0);
  const combinedResolved = combinedWon + (a.lost||0) + (b.lost||0);
  const combinedWr = combinedResolved > 0 ? (combinedWon/combinedResolved*100) : 0;

  document.getElementById("content").innerHTML = `
    <div class="total">
      <div class="tlabel">Combined P&L</div>
      <div class="tpnl" style="color:${pc(totalPnl)}">${fm(totalPnl)}</div>
      <div class="tmeta">
        <span>Trades: <span style="color:#9188b0">${totalTrades}</span></span>
        <span>Open: <span style="color:#9188b0">${totalOpen}</span></span>
        <span>WR: <span style="color:${wc(combinedWr)}">${combinedWr.toFixed(1)}%</span></span>
        <span>In play: <span style="color:#9188b0">$${totalInvested.toFixed(2)}</span></span>
      </div>
    </div>

    <div class="row">
      <div class="sc" style="border-color:#a78bfa33">
        <div class="sl" style="color:#a78bfa">Bot A P&L</div>
        <div class="sv" style="color:${pc(a.total_pnl||0)}">${fm(a.total_pnl||0)}</div>
        <div class="ss">${(a.win_rate||0).toFixed(0)}% win rate</div>
      </div>
      <div class="sc" style="border-color:#00e67633">
        <div class="sl" style="color:#00e676">Bot B P&L</div>
        <div class="sv" style="color:${pc(b.total_pnl||0)}">${fm(b.total_pnl||0)}</div>
        <div class="ss">${(b.win_rate||0).toFixed(0)}% win rate</div>
      </div>
    </div>

    <div class="div"></div>
    <div class="sec">Bot A — Conservative</div>
    ${botCard(a, "#a78bfa", "5 min scan")}

    <div class="sec">Bot B — High Velocity</div>
    ${botCard(b, "#00e676", "5 sec scan")}

    <div class="note">
      All trades paper — no real money at risk yet<br>
      P&L realized when markets resolve (days–weeks)<br>
      Go-live decision: April 30th
    </div>`;

  document.getElementById("upd").textContent = "Live · " + new Date().toLocaleTimeString();
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
