"""
Market Scanner — fetches and filters live Polymarket markets.
"""
import aiohttp
import logging
import json

log = logging.getLogger("polyagent.scanner")

GAMMA_API = "https://gamma-api.polymarket.com"

CATEGORY_KEYWORDS = {
    "Politics":     ["politics", "election", "president", "congress", "vote", "government", "senate", "republican", "democrat", "policy", "law"],
    "Sports":       ["nfl", "nba", "mlb", "nhl", "soccer", "championship", "win", "super bowl", "world cup", "playoff", "tournament", "match"],
    "Crypto":       ["bitcoin", "ethereum", "btc", "eth", "crypto", "defi", "token", "blockchain", "coinbase", "binance", "solana"],
    "World Events": ["war", "economy", "climate", "ai", "tech", "recession", "gdp", "rate", "fed", "nuclear", "treaty", "disaster"],
}


class MarketScanner:
    def __init__(self, config):
        self.config = config

    async def get_markets(self):
        """Fetch active markets filtered by quality thresholds."""
        try:
            async with aiohttp.ClientSession() as session:
                async with session.get(
                    f"{GAMMA_API}/markets",
                    params={
                        "active": "true",
                        "closed": "false",
                        "limit": 50,
                        "order": "volume",
                        "ascending": "false",
                    },
                    timeout=aiohttp.ClientTimeout(total=15)
                ) as resp:
                    if resp.status != 200:
                        log.warning(f"Gamma API returned {resp.status}")
                        return []
                    data = await resp.json()
        except Exception as e:
            log.error(f"Failed to fetch markets: {e}")
            return []

        markets = []
        for m in data:
            try:
                volume = float(m.get("volume") or 0)
                liquidity = float(m.get("liquidity") or 0)

                # Quality filters
                if volume < self.config.MIN_VOLUME:
                    continue
                if liquidity < self.config.MIN_LIQUIDITY:
                    continue

                # Parse prices
                yes_price = 0.5
                try:
                    prices = json.loads(m.get("outcomePrices") or "[0.5, 0.5]")
                    yes_price = float(prices[0])
                except Exception:
                    pass

                # Skip near-certain outcomes (boring + risky)
                if yes_price < 0.05 or yes_price > 0.95:
                    continue

                category = self._categorize(m.get("question") or m.get("title") or "")

                markets.append({
                    "id": m.get("id") or m.get("conditionId"),
                    "question": m.get("question") or m.get("title") or "Unknown",
                    "yes_price": yes_price,
                    "no_price": 1 - yes_price,
                    "volume": volume,
                    "liquidity": liquidity,
                    "end_date": m.get("endDate") or m.get("endDateIso"),
                    "category": category,
                    "raw": m,
                })
            except Exception as e:
                log.debug(f"Skipping malformed market: {e}")
                continue

        log.info(f"Scanner found {len(markets)} quality markets")
        return markets[:self.config.MARKETS_PER_SCAN]

    def _categorize(self, text):
        text_lower = text.lower()
        for category, keywords in CATEGORY_KEYWORDS.items():
            if any(k in text_lower for k in keywords):
                return category
        return "World Events"
